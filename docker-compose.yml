services:
  frontend:
    image: nginx:alpine
    volumes:
      - /opt/stock-us-code/checkout/frontend:/usr/share/nginx/html
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - /opt/stock-us-code/backend:/app
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

networks:
  default:
    name: us-stock-network
